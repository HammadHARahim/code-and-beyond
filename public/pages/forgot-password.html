<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Forgot Password - Code & Beyond</title>
    <meta name="description" content="Reset your Code & Beyond account password">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Orbitron:wght@400;700&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="../styles/password-reset.css">

    <!-- Supabase CDN -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>

<body>
    <div class="reset-container">
        <div class="reset-card">
            <div class="reset-header">
                <div class="reset-icon">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <path d="M12 15v2m-6 4h12a2 2 0 002-2v-6a2 2 0 00-2-2H6a2 2 0 00-2 2v6a2 2 0 002 2z" />
                        <path d="M6 11V7a6 6 0 1112 0v4" />
                    </svg>
                </div>
                <h1 class="reset-title">Forgot Password?</h1>
                <p class="reset-description">
                    Enter your email address and we'll send you a link to reset your password.
                </p>
            </div>

            <!-- Success Message -->
            <div id="success-message" class="message message-success">
                <strong>Email sent!</strong> If an account exists with this email, you'll receive a password reset link shortly.
            </div>

            <!-- Error Message -->
            <div id="error-message" class="message message-error">
                <span id="error-text">An error occurred. Please try again.</span>
            </div>

            <form id="forgot-password-form" class="reset-form">
                <div class="form-group">
                    <label for="email" class="form-label">Email Address</label>
                    <input 
                        type="email" 
                        id="email" 
                        class="form-input" 
                        placeholder="you@example.com"
                        required
                        autocomplete="email"
                    >
                </div>

                <button type="submit" id="submit-btn" class="btn-primary">
                    Send Reset Link
                </button>
            </form>

            <div class="back-link">
                <a href="login.html">
                    <svg width="16" height="16" viewBox="0 0 16 16" fill="none">
                        <path d="M10 12L6 8L10 4" stroke="currentColor" stroke-width="2"/>
                    </svg>
                    Back to Login
                </a>
            </div>
        </div>
    </div>

    <script type="module" src="../scripts/forgot-password.js"></script>
</body>

</html>
